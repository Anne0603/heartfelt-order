<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心意 · 訂單管理系統</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ 登入畫面 ============ -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-seal">心</div>
      <h1>心意訂單系統</h1>
      <p class="sub">請用授權的 Google 帳號登入</p>
      <button class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        使用 Google 帳號登入
      </button>
      <div class="login-loading" id="login-loading">登入中…</div>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- ============ 審核中畫面 ============ -->
  <div class="login-screen" id="pending-screen" style="display:none;">
    <div class="login-card">
      <div class="login-seal">心</div>
      <h1>申請已送出</h1>
      <p class="sub" id="pending-email-text">審核中，請聯絡管理員核准後再回來登入</p>
      <button class="btn-secondary btn" id="btn-pending-logout" style="width:100%;justify-content:center;">切換帳號 / 登出</button>
    </div>
  </div>

  <!-- ============ 主應用框架 ============ -->
  <div class="app-shell" id="app-shell">

    <!-- 手機版頂部列 -->
    <div class="mobile-topbar">
      <button class="mobile-menu-btn" id="btn-mobile-menu" aria-label="開啟選單">☰</button>
      <div class="brand-seal app-brand-seal" id="mobile-brand-seal">心</div>
      <div class="name" style="flex:1;">心意</div>
    </div>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-row" style="flex:1;">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            <div class="brand-seal app-brand-seal" id="desktop-brand-seal">心</div>
            <div class="brand-text">
              <div class="name">心意</div>
              <div class="sub">訂單管理系統</div>
            </div>
          </div>
          <button class="sidebar-toggle" id="btn-sidebar-toggle" aria-label="收合側邊欄" title="收合／展開側邊欄">☰</button>
        </div>
      </div>

      <nav id="nav-container"></nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="btn-notif-bell" style="display:none;margin-top:0;margin-bottom:8px;justify-content:space-between;">
          <span>🔔 待審核申請</span>
          <span id="notif-badge" style="background:var(--rose);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;display:none;"></span>
        </button>
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar"></div>
          <input type="file" accept="image/*" id="avatar-file-input" style="display:none;" />
          <div class="user-meta">
            <div class="name" id="user-chip-name"></div>
            <div class="role" id="user-chip-role"></div>
          </div>
        </div>
        <button class="btn-logout" id="btn-refresh-desktop" title="重新整理" style="margin-top:0;">⟳ <span class="btn-logout-label">重新整理</span></button>
        <button class="btn-logout" id="btn-logout" title="登出">⏻ <span class="btn-logout-label">登出</span></button>
      </div>
    </aside>

    <main class="main">
      <div id="main-content"></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
