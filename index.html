<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心意 · 訂單系統</title>
<link rel="stylesheet" href="css/style.css" />

<!-- 可加到手機主畫面、像 App 一樣獨立開啟 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3D4356" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="心意訂單" />
</head>

<body>

  <!-- ============ 登入畫面 ============ -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-seal">心</div>
      <h1>心意訂單系統</h1>
      <p class="sub">請用授權的 Google 帳號登入</p>
      <button class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        使用 Google 帳號登入
      </button>
      <div class="login-loading" id="login-loading">登入中…</div>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- ============ 審核中畫面 ============ -->
  <div class="login-screen" id="pending-screen" style="display:none;">
    <div class="login-card">
      <div class="login-seal">心</div>
      <h1>申請已送出</h1>
      <p class="sub" id="pending-email-text">審核中，請聯絡管理員核准後再回來登入</p>
      <button class="btn-secondary btn" id="btn-pending-logout" style="width:100%;justify-content:center;">切換帳號 / 登出</button>
    </div>
  </div>

  <!-- ============ 主應用框架 ============ -->
  <div class="app-shell" id="app-shell">

    <!-- 離線提示：斷網時顯示，避免使用者不知道操作可能存不進去 -->
    <div id="offline-banner" style="display:none;"><span class="icon-svg" style="--icon-size:14px;vertical-align:-2px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg></span> 目前離線中，資料可能無法儲存，請檢查網路連線</div>

    <!-- 常駐上方 Bar：不管手機電腦都顯示 -->
    <div class="app-topbar">
      <button class="mobile-menu-btn" id="btn-menu-toggle" aria-label="開啟選單"><span class="icon-svg" style="--icon-size:19px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></span></button>
      <button class="topbar-brand" id="btn-topbar-home" aria-label="回首頁">
        <div class="brand-seal" id="topbar-brand-seal">心</div>
        <span class="name" id="topbar-greeting">心意</span>
      </button>
      <div style="flex:1;"></div>
      <div class="notif-bell-wrap">
        <button class="mobile-menu-btn" id="btn-notif-bell" aria-label="通知"><span class="icon-svg" style="--icon-size:19px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 4.5 1.5 6 2 6.5H4c.5-.5 2-2 2-6.5Z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0"/></svg></span><span id="notif-badge" class="notif-badge-dot"></span></button>
        <div class="notif-dropdown" id="notif-dropdown"></div>
      </div>
    </div>

    <div class="app-body">
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <aside class="sidebar" id="sidebar">
        <nav id="nav-container" style="margin-top:6px;"></nav>

        <div class="sidebar-footer">
          <button class="user-chip" id="btn-open-profile" style="width:100%;border:none;background:transparent;cursor:pointer;text-align:left;">
            <div class="user-avatar" id="user-avatar"></div>
            <div class="user-meta">
              <div class="name" id="user-chip-name"></div>
              <div class="role" id="user-chip-role"></div>
            </div>
          </button>
          <button class="btn-logout" id="btn-refresh-desktop" title="重新整理" style="margin-top:8px;"><span class="icon-svg" style="--icon-size:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 18.5 15.5"/><polyline points="20 5 20 11 14 11"/></svg></span> <span class="btn-logout-label">重新整理</span></button>
          <button class="btn-logout" id="btn-logout" title="登出"><span class="icon-svg" style="--icon-size:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3.5" x2="12" y2="11"/><path d="M7 5.5a7.5 7.5 0 1 0 10 0"/></svg></span> <span class="btn-logout-label">登出</span></button>
        </div>
      </aside>

      <main class="main">
        <div id="main-content"></div>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js?v=20260830-70"></script>
  <script>
    // 註冊 Service Worker，讓瀏覽器判定這個網站可以「加到主畫面」。
    // 這個 service-worker.js 本身不快取任何東西（見檔案內註解），
    // 所以不受主程式那套版本號機制影響，不用每次部署跟著改版本號。
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {
          // 註冊失敗（例如較舊的瀏覽器不支援）安靜忽略，不影響網站正常使用，
          // 只是那個裝置沒辦法把網站加到主畫面而已。
        });
      });
    }
  </script>
</body>
</html>
